name: iOS Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Verify Xcode Installation
        run: xcodebuild -version

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Create API Keys File
        run: |
          mkdir -p lib/src/utils

          cat > lib/src/utils/api_keys.dart <<'EOF'
          class ApiKeys {
            static const String keralaApiKey = '${{ secrets.KERALA_API_KEY }}';
            static const String annamApiKey = '${{ secrets.ANNAM_API_KEY }}';
          }
          EOF

      - name: Install Apple Signing Certificate and Provisioning Profile
        env:
          IOS_DISTRIBUTION_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/CloudSense_Distribution.p12"
          PP_PATH="$RUNNER_TEMP/CloudSenseVis_AppStore.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo -n "$IOS_DISTRIBUTION_CERTIFICATE" | \
            base64 --decode -o "$CERTIFICATE_PATH"

          echo -n "$IOS_PROVISIONING_PROFILE" | \
            base64 --decode -o "$PP_PATH"

          echo "Creating temporary keychain..."

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Importing Apple Distribution certificate..."

          security import "$CERTIFICATE_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo "Checking signing identity..."

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo "Decoding provisioning profile..."

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          security cms \
            -D \
            -i "$PP_PATH" \
            > "$PROFILE_PLIST"

          UUID=$(/usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$PROFILE_PLIST")

          PROFILE_NAME=$(/usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$PROFILE_PLIST")

          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$PROFILE_PLIST")

          echo "Provisioning Profile UUID: $UUID"
          echo "Provisioning Profile Name: $PROFILE_NAME"
          echo "Provisioning Profile App ID: $APP_IDENTIFIER"

          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PP_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          echo "Provisioning profile installed successfully."

      - name: Prepare Flutter iOS Project
        run: |
          flutter build ios \
            --release \
            --config-only

      - name: Create ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>3833542F6K</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.annamai.cloudsensevis</key>
                  <string>CloudSenseVis_AppStore</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Verify Xcode Manual Signing Settings
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=3833542F6K \
            PROVISIONING_PROFILE_SPECIFIER=CloudSenseVis_AppStore \
            | grep -E "CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER"

      - name: Archive Signed iOS App
        run: |
          mkdir -p build/ios/archive

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/ios/archive/CloudSenseVis.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=3833542F6K \
            PROVISIONING_PROFILE_SPECIFIER=CloudSenseVis_AppStore \
            CODE_SIGNING_ALLOWED=YES

      - name: Export Signed IPA
        run: |
          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/ios/archive/CloudSenseVis.xcarchive" \
            -exportPath "$PWD/build/ios/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Verify IPA
        run: |
          echo "Generated IPA files:"
          ls -lh build/ios/ipa/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudSense-iOS-Release
          path: build/ios/ipa/*.ipa
          retention-days: 14